<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamFlow</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1742">
<style>:root{--n:#0f1742;--t:#14b8a6;--v:#8b7cf6;--bg:#f5f6fa;--c:#fff;--tx:#1b1f3b}@media(prefers-color-scheme:dark){:root{--bg:#171a2e;--c:#222640;--tx:#e8eaf6}}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:64px}main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--c);border-radius:12px;box-shadow:0 1px 4px #0002;padding:12px;margin:10px 0;overflow-x:auto}
input,select,button{font:inherit;padding:9px;margin:3px;border-radius:8px;border:1px solid #8886;background:var(--c);color:var(--tx)}button{background:var(--n);color:#fff;border:0;min-height:40px}button.t{background:var(--t)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--n)}nav button{flex:1;border-radius:0;margin:0;font-size:12px}nav .on{background:var(--t)}
table{border-collapse:collapse;width:100%}td,th{padding:5px;border-bottom:1px solid #8883;text-align:left}.w{color:#d97706}.bad{color:#dc2626}.ok{color:#16a34a}canvas{max-width:100%}</style></head>
<body><main id="v"></main><nav id="nav"></nav>
<script src="lib/jspdf.umd.min.js"></script><script src="lib/xlsx.full.min.js"></script><script src="js/core.js"></script><script src="js/app.js"></script></body></html>
